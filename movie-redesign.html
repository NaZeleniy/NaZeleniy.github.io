facts:[{"kind": "fact", "text": "На роль Нео претендовали Юэн МакГрегор и Леонардо ДиКаприо и Том Круз. В свою очередь, Вэл Килмер претендовал на роль Морфиуса. Уилл Смит также вполне мог сыграть Нео, однако предпочел сняться в неудавшемся «Диком, диком Западе» (1999).", "spoiler": false}, {"kind": "fact", "text": "Роль агента Смита по замыслу режиссёров Ланы Вачовски и Лилли должен был исполнить француз Жан Рено. Однако последний предпочел поработать в другом голливудском блокбастере — «Годзилла».", "spoiler": false}, {"kind": "fact", "text": "Во время съемок одной из сцен актриса Керри-Энн Мосс сломала ногу, однако решила не ставить в известность съемочную группу, дабы не лишиться знаковой в её карьере роли.", "spoiler": false}, {"kind": "fact", "text": "Перед началом съемок ведущие актеры изучали основы восточных единоборств. Длилось это обучение с октября 1997 года по март 1998 года. Актеры не ожидали таких нагрузок и были полностью уверены, что для получения практических навыков хватит и нескольких недель.", "spoiler": false}, {"kind": "fact", "text": "Как только картина вышла на экраны и поразила зрителей эффектом замирающей камеры, тут же возникло множество людей, утверждающих, что именно они первыми перенесли это изобретение на большой экран. Французский режиссер Мишель Гондри использовал этот эффект в рекламе страховой компании, а чуть позднее в клипе поп-звезды Бьорк. Архитектор Мэттью Банистер подробно описал данную проблему в своей научной работе. Он предположил, что движение и время в кадре могут идти как параллельно, так и отдельно друг от друга. Однако в то время аппаратура не позволяла провести данный эксперимент. И, наконец, художник Тим МакМиллан продемонстрировал эту технику на одном из британских каналов в 1993 году. Возможно, каждый из них изобрел этот эффект по отдельности, возможно кто-то воспользовался идеями других. Так или иначе, для большинства обывателей, революционерами все равно останутся Лана и Лилли Вачовски.", "spoiler": false}, {"kind": "fact", "text": "В картине немало обращений к сказкам Льюиса Кэрролла «Алиса в стране чудес» и «Алиса в зазеркалье». В фильме также содержится множество ссылок на Маркса, Кафку, дзэн-буддизм и «Одиссею» Гомера.", "spoiler": false}, {"kind": "blooper", "text": "В эпизоде, где Тринити и Нео в поисках Морфиуса оказываются на крыше, один из пилотов вертолета трансформируется в агента Джонса. При этом левый висок Джонса приходится на затылок пилота. Однако после выстрела Тринити именно в этот висок, пулевое отверстие у пилота, покинутого «программой» агента, почему-то оказывается во лбу.", "spoiler": true}, {"kind": "blooper", "text": "В сцене, когда Нео впервые встречается с Морфиусом, герой Лоренса Фишбёрна здоровается с Избранным. Морфиус протягивает правую руку, при этом левая рука у него за спиной. Далее сразу же следует вставка с другого ракурса, где левая рука уже почему-то опущена к полу. В следующем кадре левая рука Морфиуса снова за спиной.", "spoiler": true}, {"kind": "blooper", "text": "Когда агент Смит и Морфиус дерутся, последний бьёт агента головой и ломает ему очки. В следующем кадре камера показывает Морфиуса, и можно заметить, что очки ещё надеты на агенте Смите.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 2-й минуте фильма полицейские вламываются в гостиничный номер, чтобы задержать Тринити, она в это момент сидит в неосвещённой комнате. Когда в следующей сцене ей удаётся обезвредить всех полицейских, отчётливо видно, что на стенах появляются работающие светильники.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 6-й минуте фильма Тринити с разбега прыгает в окно, плафон лампы под потолком висит неподвижно. После смены кадра, когда Тринити целится в сторону разбитого окна, и камера приближается к окну, плафон начинает качаться. Светильник вновь висит неподвижно, когда Тринити собирается встать.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 6-й минуте фильма Тринити забегает в телефонную будку, у неё на лице заметен кровавый порез, хотя в прошлой сцене, после прыжка в окно, пореза не было.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 13-й минуте фильма начальник отчитывает Нео за опоздание, положение рук Томаса меняется при сменах кадра.", "spoiler": true}, {"kind": "blooper", "text": "На 14-й минуте фильма Нео берётся за край конверта, чтобы открыть его. В следующем кадре, когда курьер уходит, Нео делает это ещё раз.", "spoiler": true}],
  faq:[
    {q:"О чём фильм «Матрица» без спойлеров концовки?",a:`Фильм следует за Томасом Андерсоном, который начинает подозревать, что привычная реальность — лишь тщательно сконструированная иллюзия. Встреча с Морфеусом и его командой втягивает героя в конфликт с системой контроля и её агентами, заставляя выбирать между комфортной ложью и рискованной правдой.`},
    {q:"Почему фильм называется «The Matrix»?",a:`«Матрица» — это название симулированной реальности, в которой живёт большинство людей, не подозревая об этом. Слово намекает и на «систему», и на «среду», которая формирует восприятие мира и поведение человека.`},
    {q:"Что означают красная и синяя таблетки?",a:`Это метафора выбора: синяя — остаться в привычной картине мира, красная — узнать правду и принять последствия. В контексте фильма это не «магия», а сюжетный инструмент, который фиксирует момент осознанного решения героя.`},
    {q:"Кто такой Нео и почему он важен?",a:`Нео — хакер Томас Андерсон, которого считают ключевой фигурой в борьбе с Матрицей. Его путь — история о сомнениях, выборе и становлении. Персонажа играет <a href="#">Киану Ривз</a>.`},
    {q:"Что означает фраза «There is no spoon»?",a:`Внутри симуляции объект не «реален» сам по себе — меняется восприятие и понимание правил, по которым устроена Матрица. Контролируя ум и интерпретацию, можно «согнуть» ограничения симуляции.`},
    {q:"Нужно ли смотреть продолжения, чтобы понять первый фильм?",a:`Нет, первый фильм работает как самостоятельная история с завершённой аркой. Продолжения расширяют лор, но базовые идеи и сюжет 1999 года понятны без них.`}
  ],

  sites:{
    "Онлайн-кинотеатры":[
      {host:"okko.tv",url:"#",stream:true},{host:"kion.ru",url:"#",stream:true},
      {host:"netflix.com",url:"#",stream:true},{host:"amazon.com",url:"#",stream:true},
      {host:"tv.apple.com",url:"#",stream:true},{host:"kino.tricolor.ru",url:"#",stream:true}
    ],
    "Официальные сайты":[{host:"warnerbros.com",url:"#"},{host:"radiofrance.fr",url:"#"}],
    "Саундтреки":[{host:"open.spotify.com",url:"#"},{host:"music.yandex.ru",url:"#"},{host:"filmmusic.com",url:"#"}],
    "Энциклопедии":[{host:"ru.wikipedia.org",url:"#"},{host:"rottentomatoes.com",url:"#"},{host:"metacritic.com",url:"#"},{host:"boxofficemojo.com",url:"#"}]
  }
};

/* ═══ ХЕЛПЕРЫ ═══ */
const $=(s,r=document)=>r.querySelector(s);
const cls=v=>v>=7?'high':v<5?'low':'';           // родные модификаторы .high/.low
const money=n=>'$'+n.toLocaleString('ru-RU');
const votes=n=>n>=1e6?(n/1e6).toFixed(1)+' млн':n>=1e3?Math.round(n/1e3)+'K':n;
const dur=s=>{if(!s)return'';const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};

/* фон-постер как на сайте */
$('#bg-poster').style.backgroundImage=`url("${DATA.backdrop}")`;

/* ═══ HERO (родные классы content-card / ratings-links / movie-layout) ═══ */
const R=DATA.ratings;
const nf=n=>n.toLocaleString('ru-RU');
// favicon источника с откатом DDG → Google → буква
const favIco=(host,letter)=>`<span class="rating-fav" data-l="${letter}"><img src="https://icons.duckduckgo.com/ip3/${host}.ico" alt="" data-h="${host}" onerror="if(this.dataset.g){this.remove()}else{this.dataset.g=1;this.src='https://www.google.com/s2/favicons?domain='+this.dataset.h+'&sz=64'}"></span>`;
const ratingLink=(host,letter,url,val,cls2,title='')=>
  `<div class="rating-container"><a class="rating-link" href="${url}" target="_blank" rel="noopener"${title?` title="${title}"`:''}>${favIco(host,letter)}<span class="rating-value ${cls2}">${val}</span></a></div>`;
const ratingsHtml=[
  ratingLink('kinopoisk.ru','К',`https://www.kinopoisk.ru/film/${DATA.kp_id}/`, R.kp, cls(R.kp), `${nf(DATA.votes.kp)} оценок на Кинопоиске`),
  ratingLink('imdb.com','I',`https://www.imdb.com/title/${DATA.imdb_id}/`, R.imdb, cls(R.imdb), `${nf(DATA.votes.imdb)} оценок на IMDb`),
  ratingLink('themoviedb.org','T',`https://www.themoviedb.org/movie/${DATA.tmdb_id}`, R.tmdb, cls(R.tmdb), `${nf(DATA.votes.tmdb)} оценок на TMDB`),
  ratingLink('rottentomatoes.com','R',DATA.rt_url, R.rt+'%', cls(R.rt/10), 'Rotten Tomatoes'),
  ratingLink('metacritic.com','M',DATA.mc_url, R.mc, cls(R.mc/10), 'Metacritic')
].join('');

$('#movieContent').innerHTML=`
  <div class="content-header">${DATA.logo
    ? `<img class="nz-logo" src="${DATA.logo}" alt="${DATA.title.ru}">`
    : `<h1 class="content-title">${DATA.title.ru}</h1>`}</div>
  <div class="ratings-links">${ratingsHtml}</div>

  <div class="movie-layout">
    <div class="movie-layout-poster">
      <div class="nz-poster-rotator" id="posterRot"></div>
    </div>
    <div class="movie-layout-main">
      <div class="player-coming-soon" style="width:100%;margin-left:0;margin-top:0">
        <span>▶ Плеер и «Буду смотреть» — здесь (без изменений от текущей страницы)</span>
      </div>

      <!-- ═══ ВКЛАДКИ ═══ -->
      <div class="nzt">
        <div class="nzt-bar" id="nztBar"><span class="nzt-pill" id="nztPill"></span></div>
        <div class="nzt-panels" id="nztPanels"></div>
      </div>
    </div>
  </div>`;

/* ═══ РОТАТОР ПОСТЕРОВ (все постеры из /images, кросс-фейд каждые 3с) ═══ */
(()=>{
  const rot=$('#posterRot'), P=DATA.posters||[];
  if(!P.length){ rot.innerHTML=`<img class="on" src="${DATA.poster}" alt="">`; return; }
  rot.innerHTML=P.map((u,i)=>`<img src="${u}" alt="" loading="${i<2?'eager':'lazy'}"${i===0?' class="on"':''}>`).join('');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(P.length>1 && !reduce){
    let i=0;
    setInterval(()=>{const im=rot.children;im[i].classList.remove('on');i=(i+1)%im.length;im[i].classList.add('on')},3000);
  }
})();

/* ═══ ВКЛАДКИ ═══ */
const TABS=[
  {id:'overview',label:'Обзор'},
  {id:'actors',label:'Актёры',n:DATA.cast.reduce((s,g)=>s+g.items.length,0)},
  {id:'photos',label:'Фото',n:Object.values(DATA.photos).flat().length},
  {id:'videos',label:'Видео',n:DATA.videos.length},
  {id:'awards',label:'Награды',n:DATA.awards.length},
  {id:'quotes',label:'Цитаты',n:DATA.quotes.length},
  {id:'facts',label:'Факты',n:DATA.facts.length},
  {id:'parental',label:'Родителям'},
  {id:'faq',label:'Вопросы',n:DATA.faq.length},
  {id:'similar',label:'Связи',n:DATA.franchise.length+DATA.similar.length+DATA.references.length+DATA.referenced_in.length},
  {id:'sites',label:'Сайты'}
];
const bar=$('#nztBar'), ink=$('#nztPill'), panels=$('#nztPanels');
TABS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.className='nzt-tab'+(i===0?' on':'');
  b.innerHTML=t.label+(t.n?`<span class="n">${t.n}</span>`:'');
  b.onclick=()=>select(i);
  bar.appendChild(b);
  const p=document.createElement('section');
  p.className='nzt-panel'+(i===0?' on':''); p.id='np-'+t.id;
  panels.appendChild(p);
});
const tabBtns=[...bar.querySelectorAll('.nzt-tab')];
function moveInk(b){ ink.style.width=b.offsetWidth+'px'; ink.style.transform=`translateX(${b.offsetLeft}px)` }
function select(i){
  tabBtns.forEach((b,j)=>b.classList.toggle('on',i===j));
  panels.querySelectorAll('.nzt-panel').forEach((p,j)=>p.classList.toggle('on',i===j));
  moveInk(tabBtns[i]);
  tabBtns[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}

/* ═══ РЕНДЕР ПАНЕЛЕЙ ═══ */
const F=DATA.finance;
$('#np-overview').innerHTML=`
  <p style="font-style:italic;color:var(--text-secondary);margin:0 0 14px;font-size:16px">«${DATA.tagline}»</p>
  <ul class="info-list">
    <li><strong>Оригинал:</strong> ${DATA.title.en}</li>
    <li><strong>Год:</strong> ${DATA.year} · ${DATA.runtime} мин</li>
    <li><strong>Страны:</strong> ${DATA.countries.join(', ')}</li>
    <li><strong>Жанры:</strong> ${DATA.genres.join(', ')}</li>
    <li><strong>Бюджет:</strong> ${money(F.budget)}</li>
    <li><strong>Сборы в мире:</strong> ${money(F.box)}</li>
    <li><strong>Премьера в РФ:</strong> ${DATA.premiere_ru}</li>
  </ul>
  <p class="content-description-text" style="margin-top:14px">${DATA.overview}</p>
  <div class="rating-boxes" style="margin-top:14px">
    <span class="rating-box age">${DATA.age}+</span>
    <span class="rating-box" style="background:rgba(255,255,255,.06);color:var(--text-secondary)">${DATA.mpaa}</span>
  </div>
  <p class="nz-subhead">Студии</p>
  <div class="nz-chips">${DATA.companies.studio.map(c=>`<span class="nz-chip">${c}</span>`).join('')}</div>
  <p class="nz-subhead">Визуальные эффекты</p>
  <div class="nz-chips">${DATA.companies.vfx.map(c=>`<span class="nz-chip">${c}</span>`).join('')}</div>`;

// Награды
(()=>{
  const g={}; DATA.awards.forEach(a=>(g[a.name]=g[a.name]||[]).push(a));
  const ok=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const dt=`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>`;
  $('#np-awards').innerHTML=Object.entries(g).map(([name,list])=>{
    const won=list.filter(a=>a.won).length;
    return `<div class="nz-awg"><div class="nz-awg-h"><b>${name}</b>${won?`<span class="p">${won} побед</span>`:''}</div>
      ${list.map(a=>`<div class="nz-aw ${a.won?'won':'nom'}"><span class="m">${a.won?ok:dt}</span><span>${a.category}</span><time>${a.year}</time></div>`).join('')}</div>`;
  }).join('');
})();

// Видео — группировка по типу (как «Сайты»)
(()=>{
  const play=`<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
  const ORDER=['трейлер','тизер','обзор','фрагмент','со съёмок'];
  const LABEL={'трейлер':'Трейлеры','тизер':'Тизеры','обзор':'Обзоры','фрагмент':'Фрагменты','со съёмок':'Со съёмок'};
  const card=v=>`<a class="nz-vid" href="https://www.youtube.com/watch?v=1785692756${v.id}" target="_blank" rel="noopener">
      <img loading="lazy" src="${v.prev}" alt=""><div class="pl"><span>${play}</span></div>
      <div class="mt"><span class="k">${v.kind}</span>${v.dur?` <span class="d">${dur(v.dur)}</span>`:''}</div></a>`;
  // сначала известный порядок, затем прочие типы из данных
  const kinds=[...ORDER, ...[...new Set(DATA.videos.map(v=>v.kind))].filter(k=>!ORDER.includes(k))];
  $('#np-videos').innerHTML=kinds.map(k=>{
    const list=DATA.videos.filter(v=>v.kind===k);
    return list.length?`<div class="nz-sg"><span class="lbl">${LABEL[k]||k}</span>
      <div class="nz-vids">${list.map(card).join('')}</div></div>`:'';
  }).join('');
})();

// Цитаты
$('#np-quotes').innerHTML=`<div class="nz-quotes">${DATA.quotes.map(q=>`
  <figure class="nz-quote"><span class="mk">“</span>
    <blockquote>${q.text}</blockquote><div class="o">${q.orig}</div>
    <figcaption class="b"><b>${q.by}</b> · ${q.role}</figcaption></figure>`).join('')}</div>`;

// Родителям
$('#np-parental').innerHTML=`<div class="nz-pg-list">${DATA.parental.map(p=>`
  <div class="nz-pg ${p.sev}"><span class="cat">${p.cat}</span>
    <span class="mtr"><i></i><i></i><i></i></span><span class="lvl">${p.ru}</span></div>`).join('')}</div>`;

// Вопросы
(()=>{
  const plus=`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>`;
  $('#np-faq').innerHTML=`<div class="nz-faq">${DATA.faq.map(f=>`
    <details class="nz-qa"><summary>${plus}<span>${f.q}</span></summary><div class="bd">${f.a}</div></details>`).join('')}</div>`;
})();

// Связи — родные similar-card, 4 группы
(()=>{
  const meta=m=>[m.y||null, m.r!=null?('★ '+m.r):null].filter(Boolean).join(' · ');
  const cards=arr=>`<div class="similars-list">${arr.map(m=>`
    <a class="similar-card" href="#">
      <div class="similar-poster-wrap"><img loading="lazy" src="${m.p}" alt=""></div>
      <div class="similar-info"><div class="similar-title">${m.t}</div>
        <div class="similar-meta">${meta(m)}</div></div></a>`).join('')}</div>`;
  const grp=(title,arr,first)=>arr.length?`<div class="nz-section-title"${first?'':' style="margin-top:26px"'}>${title}</div>${cards(arr)}`:'';
  $('#np-similar').innerHTML=
    grp('Франшизы',DATA.franchise,true)+
    grp('Похожие',DATA.similar)+
    grp('Ссылается на',DATA.references)+
    grp('Упоминается в',DATA.referenced_in);
})();

// Где смотреть
$('#np-sites').innerHTML=Object.entries(DATA.sites).map(([sec,list])=>`
  <div class="nz-sg"><span class="lbl">${sec}</span>
    <div class="nz-links">${list.map(s=>`
      <a class="nz-lnk ${s.stream?'stream':''}" href="${s.url}" target="_blank" rel="noopener">
        <span class="ic" data-l="${s.host[0]}"><img src="https://icons.duckduckgo.com/ip3/${s.host}.ico" alt="" loading="lazy" data-h="${s.host}" onerror="if(this.dataset.g){this.remove()}else{this.dataset.g=1;this.src='https://www.google.com/s2/favicons?domain='+this.dataset.h+'&sz=64'}"></span>
        <span><b>${s.host}</b><span>${s.stream?'Смотреть онлайн':'Перейти'}</span></span></a>`).join('')}</div></div>`).join('');

// Актёры и съёмочная группа — реальный /cast, секции по ролям
(()=>{
  const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
  const card=p=>`<a class="nz-actor" href="#">
      <div class="av" data-l="${ini(p.n)}">${p.p?`<img loading="lazy" src="${p.p}" alt="" onerror="this.remove()">`:''}</div>
      <div class="nm">${p.n}</div>${p.c?`<div class="rl">${p.c}</div>`:''}</a>`;
  $('#np-actors').innerHTML=DATA.cast.map(g=>
    `<div class="nz-section-title">${g.role_ru}</div><div class="nz-cast">${g.items.map(card).join('')}</div>`
  ).join('');
})();

// Фото — реальный /images, группировка по типу
$('#np-photos').innerHTML=Object.entries(DATA.photos).map(([sec,list])=>list.length?`
  <div class="nz-sg"><span class="lbl">${sec}</span>
    <div class="nz-photos${(sec==='Постеры'||sec==='Живые постеры')?' posters':''}">${list.map(u=>
      u.endsWith('.mp4')
        ? `<div class="nz-photo"><video src="${u}" autoplay muted loop playsinline></video></div>`
        : `<a class="nz-photo" href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="${u}" alt=""></a>`
    ).join('')}</div>
  </div>`:'').join('');

// Факты и ляпы — реальный /facts (спойлеры под блюром)
(()=>{
  const groups=[['fact','Интересные факты'],['blooper','Ляпы и ошибки']];
  $('#np-facts').innerHTML=groups.map(([k,label])=>{
    const list=DATA.facts.filter(f=>f.kind===k);
    if(!list.length) return '';
    return `<div class="nz-sg"><span class="lbl">${label}</span>
      <div class="nz-facts-list">${list.map(f=>
        `<div class="nz-factrow"><span class="fi">${k==='fact'?'💡':'🎬'}</span>`+
        (f.spoiler
          ? `<p class="nz-spoiler" onclick="this.classList.remove('nz-spoiler')" title="Спойлер — нажмите, чтобы показать">${f.text}</p>`
          : `<p>${f.text}</p>`)+
        `</div>`).join('')}</div></div>`;
  }).join('');
})();

/* индикатор */
requestAnimationFrame(()=>requestAnimationFrame(()=>moveInk(tabBtns[0])));
addEventListener('resize',()=>{const i=tabBtns.findIndex(b=>b.classList.contains('on'));if(i>=0)moveInk(tabBtns[i])});
</script>
</body>
</html>
