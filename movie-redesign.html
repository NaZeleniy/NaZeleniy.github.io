<style>
/* ─────────────────────────────────────────────────────────────
   ТОЛЬКО новый компонент: вкладки + панели для новых секций.
   Всё остальное — родные классы сайта (content-card, content-title,
   ratings-links, movie-layout, similar-card, nz-section-title…).
   Стиль вкладок: минимализм, без рамок — только скользящее
   подчёркивание акцентом; палитра/шрифт/переменные — из проекта.
   Моторика: cubic-bezier(.23,1,.32,1), <300мс (Emil Kowalski).
   ───────────────────────────────────────────────────────────── */
/* Hero: лого вместо текстового заголовка (если есть) + ротатор постеров */
.nz-logo{ display:block; margin:0 auto; max-width:min(560px,82%); max-height:150px; object-fit:contain }
.nz-poster-rotator{ position:relative; aspect-ratio:2/3; border-radius:12px; overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.4) }
.nz-poster-rotator .rot-frame{ position:absolute; inset:0; opacity:0; transition:opacity .7s ease }
.nz-poster-rotator .rot-frame.on{ opacity:1 }
.nz-poster-rotator .rot-frame img,
.nz-poster-rotator .rot-frame video{ width:100%; height:100%; object-fit:cover; display:block }

.nzt{ margin-top:26px }
/* панель вкладок — компактный «плавающий» segmented-контрол (матовое стекло),
   без тёмной полосы во всю ширину; активная вкладка — скользящая пилюля */
.nzt-bar{
  position:sticky; top:12px; z-index:30; display:flex; gap:3px;
  width:-moz-fit-content; width:fit-content; max-width:100%;
  overflow-x:auto; scrollbar-width:none; padding:5px; border-radius:16px;
  background:rgba(30,30,34,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 10px 34px -12px rgba(0,0,0,.7);
}
.nzt-bar::-webkit-scrollbar{ display:none }
.nzt-pill{
  position:absolute; top:5px; bottom:5px; left:0; z-index:0; border-radius:12px;
  background:var(--accent-dim);
  transition:transform .32s cubic-bezier(.23,1,.32,1), width .32s cubic-bezier(.23,1,.32,1);
}
.nzt-tab{
  position:relative; z-index:1; flex:0 0 auto; padding:8px 14px; border-radius:12px;
  font:600 14px/1 Roboto,sans-serif; color:var(--text-muted); background:none;
  cursor:pointer; white-space:nowrap; transition:color .2s ease;
}
.nzt-tab:hover{ color:var(--text) }
.nzt-tab.on{ color:var(--accent-light) }
.nzt-tab .n{ color:currentColor; opacity:.6; font-size:12px; font-weight:600; margin-left:5px }
.nzt-panels{ padding:28px 0 20px; min-height:40vh }
.nzt-panel{ display:none }
.nzt-panel.on{ display:block; animation:nztIn .28s cubic-bezier(.23,1,.32,1) both }
@keyframes nztIn{ from{ opacity:0; transform:translateY(10px) } }

/* Обзор */
.nz-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px }
/* саундтрек */
.nz-soundtrack{ display:inline-flex; align-items:center; gap:12px; margin-top:12px; padding:11px 15px;
  border-radius:12px; background:rgba(255,255,255,.04); color:var(--text);
  transition:background .18s cubic-bezier(.23,1,.32,1), transform .18s cubic-bezier(.23,1,.32,1) }
.nz-soundtrack:hover{ background:rgba(255,255,255,.08); transform:translateY(-2px) }
.nz-soundtrack .ic{ width:30px; height:30px; flex:0 0 auto; border-radius:8px; background:var(--accent-dim);
  display:grid; place-items:center; color:var(--accent-light); font-size:16px }
.nz-soundtrack b{ font-size:14px; font-weight:600 }
.nz-soundtrack span span{ display:block; font-size:11px; color:var(--text-muted) }
.nz-chip{ font-size:13px; color:var(--text-secondary); background:rgba(255,255,255,.05);
  padding:5px 12px; border-radius:8px }
.nz-subhead{ font-size:14px; font-weight:600; color:var(--text-secondary);
  margin:22px 0 0; letter-spacing:.01em }

/* Награды */
/* сводка сверху */
.nz-aw-top{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px }
.nz-aw-total{ flex:1; min-width:110px; padding:16px 18px; border-radius:var(--radius);
  background:rgba(255,255,255,.04); text-align:center }
.nz-aw-total b{ display:block; font:800 30px/1 Cinzel,Georgia,serif; color:var(--accent-light) }
.nz-aw-total span{ font-size:12px; color:var(--text-muted); letter-spacing:.04em }
/* карточка церемонии */
.nz-cer{ padding:16px 18px; border-radius:var(--radius); background:rgba(255,255,255,.03); margin-bottom:12px }
.nz-cer-h{ display:flex; align-items:center; gap:14px; margin-bottom:12px }
.nz-cer-ico{ width:44px; height:44px; flex:0 0 auto; object-fit:contain }
.nz-cer-t b{ display:block; font-size:17px; font-weight:700 }
.nz-cer-t span{ font-size:13px; color:var(--text-muted) }
.nz-cer-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:0 22px }
.nz-aw{ display:flex; align-items:center; gap:12px; padding:9px 2px }
.nz-aw + .nz-aw{ box-shadow:inset 0 1px 0 rgba(255,255,255,.05) }
.nz-aw .m{ flex:0 0 auto; width:20px; height:20px; display:grid; place-items:center;
  border-radius:50%; color:var(--text-muted) }
.nz-aw.won .m{ background:var(--accent-dim); color:var(--accent-light) }
.nz-aw .m svg{ width:13px; height:13px }
.nz-aw span{ font-size:14px } .nz-aw.nom span{ color:var(--text-muted) }
.nz-aw time{ margin-left:auto; color:var(--text-muted); font-size:13px }

/* Видео */
.nz-vids{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px }
.nz-vid{ position:relative; border-radius:12px; overflow:hidden; background:rgba(255,255,255,.05);
  aspect-ratio:16/9; display:block; transition:transform .2s cubic-bezier(.23,1,.32,1) }
.nz-vid:hover{ transform:translateY(-3px) }
.nz-vid img{ width:100%; height:100%; object-fit:cover; opacity:.85;
  transition:opacity .2s, transform .35s cubic-bezier(.23,1,.32,1) }
.nz-vid:hover img{ opacity:1; transform:scale(1.04) }
.nz-vid .pl{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none }
.nz-vid .pl span{ width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,.5);
  display:grid; place-items:center; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  transition:transform .2s cubic-bezier(.23,1,.32,1), background .2s }
.nz-vid:hover .pl span{ transform:scale(1.1); background:var(--accent) }
.nz-vid .pl svg{ width:17px; height:17px; margin-left:2px; fill:#fff }
.nz-vid .mt{ position:absolute; left:0; right:0; bottom:0; padding:24px 12px 10px;
  background:linear-gradient(transparent,rgba(0,0,0,.82)); pointer-events:none }
.nz-vid .k{ font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent-light); font-weight:700 }
.nz-vid .d{ color:#e8eaed; font-size:12px }

/* Актёры */
.nz-cast{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:18px }
.nz-actor{ display:block; color:var(--text) }
.nz-actor .av{ position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden;
  background:linear-gradient(135deg, rgba(39,174,96,.22), rgba(255,255,255,.05));
  display:grid; place-items:center; font:700 24px/1 Cinzel,Georgia,serif; color:var(--accent-light);
  transition:transform .2s cubic-bezier(.23,1,.32,1) }
.nz-actor:hover .av{ transform:translateY(-4px) }
.nz-actor .av::before{ content:attr(data-l) }
.nz-actor .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.nz-actor .nm{ margin-top:10px; font-size:14px; font-weight:600; color:var(--accent-light);
  text-decoration:underline; text-decoration-color:rgba(46,204,113,.35); text-underline-offset:3px; line-height:1.25 }
.nz-actor .rl{ font-size:12.5px; color:var(--text-muted); margin-top:2px }
.nz-actor .dub{ font-size:12px; color:var(--text-muted); margin-top:5px; line-height:1.3 }
.nz-actor .dub span{ display:inline-block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  font-weight:700; color:var(--accent-light); background:var(--accent-dim);
  padding:1px 6px; border-radius:5px; margin-right:5px; vertical-align:1px }

/* Фото */
.nz-photos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px }
.nz-photo{ aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:rgba(255,255,255,.05);
  cursor:zoom-in; display:block }
.nz-photo img{ width:100%; height:100%; object-fit:cover;
  transition:transform .4s cubic-bezier(.23,1,.32,1) }
.nz-photo:hover img{ transform:scale(1.05) }
.nz-photo video{ width:100%; height:100%; object-fit:cover; display:block }
.nz-photo{ position:relative }
.nz-photo-lang{ position:absolute; left:7px; top:7px; z-index:2;
  font-size:10px; font-weight:700; letter-spacing:.05em; color:#fff;
  padding:2px 7px; border-radius:6px; background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px) }
.nz-sg .lbl em{ font-style:normal; color:var(--text-muted); font-weight:600; margin-left:4px }
.nz-photo:first-child{ grid-column:span 2 }
@media (max-width:560px){ .nz-photo:first-child{ grid-column:span 1 } }
.nz-photos.posters{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)) }
.nz-photos.posters .nz-photo{ aspect-ratio:2/3 }
.nz-photos.posters .nz-photo:first-child{ grid-column:auto }

/* Факты и ляпы */
.nz-facts-list{ display:grid; gap:6px }
.nz-factrow{ display:flex; gap:13px; padding:15px 17px; border-radius:var(--radius);
  background:rgba(255,255,255,.04); font-size:14.5px; line-height:1.65; color:var(--text-secondary) }
.nz-factrow .fi{ flex:0 0 auto; font-size:16px; line-height:1.45 }
.nz-factrow p{ margin:0 }

/* Цитаты */
.nz-quotes{ display:grid; gap:6px }
.nz-quote{ position:relative; padding:20px 22px; border-radius:var(--radius);
  background:rgba(255,255,255,.04) }
.nz-quote .mk{ position:absolute; top:22px; left:15px; font:700 48px/0 Cinzel,Georgia,serif;
  color:var(--accent); opacity:.35 }
.nz-quote blockquote{ font-size:18px; font-weight:500; padding-left:32px; line-height:1.45 }
.nz-quote .o{ padding-left:32px; margin-top:8px; color:var(--text-muted); font-style:italic; font-size:14px }
.nz-quote .b{ padding-left:32px; margin-top:12px; font-size:13px; color:var(--text-muted) }
.nz-quote .b b{ color:var(--text); font-weight:600 }

/* Родителям */
.nz-pg-list{ display:grid; gap:2px; max-width:640px }
.nz-pg{ display:flex; align-items:center; gap:14px; padding:13px 2px }
.nz-pg + .nz-pg{ box-shadow:inset 0 1px 0 rgba(255,255,255,.05) }
.nz-pg .cat{ font-size:15px; flex:1; text-transform:capitalize }
.nz-pg .src{ font-size:12px; color:var(--text-muted) }
.nz-pg .mtr{ display:flex; gap:4px }
.nz-pg .mtr i{ width:24px; height:5px; border-radius:3px; background:rgba(255,255,255,.1) }
.nz-pg.mild   .mtr i:nth-child(-n+1),
.nz-pg.moderate .mtr i:nth-child(-n+2),
.nz-pg.severe .mtr i:nth-child(-n+3){ background:currentColor }
.nz-pg.mild{ color:#51cf66 } .nz-pg.moderate{ color:#e8b84b } .nz-pg.severe{ color:#e17055 }
.nz-pg .lvl{ font-size:12px; font-weight:600; min-width:54px; text-align:right }
.nz-pg .cat,.nz-pg .lvl{ color:var(--text) }

/* Вопросы (аккордеон) */
.nz-faq{ display:grid; gap:4px; max-width:840px }
.nz-qa{ border-radius:var(--radius); overflow:hidden; background:rgba(255,255,255,.04);
  transition:background .2s cubic-bezier(.23,1,.32,1) }
.nz-qa[open]{ background:rgba(255,255,255,.06) }
.nz-qa summary{ list-style:none; cursor:pointer; padding:15px 17px; display:flex;
  align-items:center; gap:13px; font-size:15px; font-weight:600 }
.nz-qa summary::-webkit-details-marker{ display:none }
.nz-qa summary .ic{ flex:0 0 auto; color:var(--text-muted);
  transition:transform .28s cubic-bezier(.23,1,.32,1) }
.nz-qa[open] summary .ic{ transform:rotate(45deg); color:var(--accent) }
.nz-qa .bd{ padding:0 17px 17px 44px; color:var(--text-secondary); font-size:14.5px; line-height:1.65 }
.nz-qa .bd a{ color:var(--accent-light) }

/* кнопка «Показать ещё» */
.nz-more{ display:block; margin:16px auto 0; padding:10px 22px; border-radius:10px;
  font:600 13.5px/1 Roboto,sans-serif; color:var(--text-secondary); background:none; cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  transition:background .18s cubic-bezier(.23,1,.32,1), color .18s ease }
.nz-more:hover{ color:var(--text); background:rgba(255,255,255,.05) }

/* Где смотреть */
.nz-sg{ margin-bottom:28px }
.nz-sg .lbl{ display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-muted); font-weight:600; margin-bottom:11px }
/* крупный заголовок группы (Фото) */
.nz-sg-h{ display:flex; align-items:baseline; gap:9px; margin:0 0 14px;
  font-size:22px; font-weight:700; letter-spacing:-.01em; color:var(--text) }
.nz-sg-h em{ font-style:normal; font-size:14px; font-weight:600; color:var(--text-muted) }
/* чип-бар фильтра по языку */
.nz-lbar{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 24px }
.nz-lchip{ font:600 13px/1 Roboto,sans-serif; color:var(--text-secondary); background:none;
  padding:7px 13px; border-radius:9px; cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  transition:background .18s cubic-bezier(.23,1,.32,1), color .18s ease, box-shadow .18s ease }
.nz-lchip:hover{ color:var(--text); background:rgba(255,255,255,.05) }
.nz-lchip.on{ color:var(--accent-light); background:var(--accent-dim);
  box-shadow:inset 0 0 0 1px rgba(46,204,113,.35) }
.nz-lchip em{ font-style:normal; color:var(--text-muted); font-weight:600; margin-left:5px }
.nz-lchip.on em{ color:var(--accent-light); opacity:.7 }
.nz-links{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:4px }
.nz-lnk{ display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:10px;
  background:rgba(255,255,255,.04); color:var(--text);
  transition:background .18s cubic-bezier(.23,1,.32,1), transform .18s cubic-bezier(.23,1,.32,1) }
.nz-lnk:hover{ background:rgba(255,255,255,.08); transform:translateY(-2px) }
.nz-lnk .ic{ position:relative; width:26px; height:26px; flex:0 0 auto;
  display:grid; place-items:center; font-weight:800; color:var(--accent-light); text-transform:uppercase }
.nz-lnk .ic::before{ content:attr(data-l) }        /* fallback-буква под иконкой */
.nz-lnk .ic img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain }
.nz-lnk b{ font-size:14px; font-weight:600 }
.nz-lnk span{ display:block; font-size:11px; color:var(--text-muted) }

/* favicon-иконка источника оценки (кликабельная ссылка), без рамки */
.rating-fav{ position:relative; width:20px; height:20px; flex:0 0 auto;
  display:inline-grid; place-items:center;
  font-size:11px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; line-height:1 }
.rating-fav::before{ content:attr(data-l) }
.rating-fav img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain }

/* статичный сайдбар-каркас (родные классы .side-panel/.nav-link) */
.side-panel .nav-link svg{ width:20px; height:20px; flex:0 0 auto }
.rd-brand{ display:grid; place-items:center; height:56px; margin-bottom:8px;
  font:800 20px/1 Cinzel,Georgia,serif; color:var(--accent) }

@media (max-width:700px){
  .nz-quote blockquote{ font-size:16px }
}
/* уважение к prefers-reduced-motion — гасим все анимации/переходы */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}
</style>
</head>

<script>
/* ═══ ДАННЫЕ (api.kinodata.space, kp/301 «Матрица») ═══ */
const DATA = {
  title:{ru:"Матрица",en:"The Matrix"},

facts:[{"kind": "fact", "text": "На роль Нео претендовали Юэн МакГрегор и Леонардо ДиКаприо и Том Круз. В свою очередь, Вэл Килмер претендовал на роль Морфиуса. Уилл Смит также вполне мог сыграть Нео, однако предпочел сняться в неудавшемся «Диком, диком Западе» (1999).", "spoiler": false}, {"kind": "fact", "text": "Роль агента Смита по замыслу режиссёров Ланы Вачовски и Лилли должен был исполнить француз Жан Рено. Однако последний предпочел поработать в другом голливудском блокбастере — «Годзилла».", "spoiler": false}, {"kind": "fact", "text": "Во время съемок одной из сцен актриса Керри-Энн Мосс сломала ногу, однако решила не ставить в известность съемочную группу, дабы не лишиться знаковой в её карьере роли.", "spoiler": false}, {"kind": "fact", "text": "Перед началом съемок ведущие актеры изучали основы восточных единоборств. Длилось это обучение с октября 1997 года по март 1998 года. Актеры не ожидали таких нагрузок и были полностью уверены, что для получения практических навыков хватит и нескольких недель.", "spoiler": false}, {"kind": "fact", "text": "Как только картина вышла на экраны и поразила зрителей эффектом замирающей камеры, тут же возникло множество людей, утверждающих, что именно они первыми перенесли это изобретение на большой экран. Французский режиссер Мишель Гондри использовал этот эффект в рекламе страховой компании, а чуть позднее в клипе поп-звезды Бьорк. Архитектор Мэттью Банистер подробно описал данную проблему в своей научной работе. Он предположил, что движение и время в кадре могут идти как параллельно, так и отдельно друг от друга. Однако в то время аппаратура не позволяла провести данный эксперимент. И, наконец, художник Тим МакМиллан продемонстрировал эту технику на одном из британских каналов в 1993 году. Возможно, каждый из них изобрел этот эффект по отдельности, возможно кто-то воспользовался идеями других. Так или иначе, для большинства обывателей, революционерами все равно останутся Лана и Лилли Вачовски.", "spoiler": false}, {"kind": "fact", "text": "В картине немало обращений к сказкам Льюиса Кэрролла «Алиса в стране чудес» и «Алиса в зазеркалье». В фильме также содержится множество ссылок на Маркса, Кафку, дзэн-буддизм и «Одиссею» Гомера.", "spoiler": false}, {"kind": "blooper", "text": "В эпизоде, где Тринити и Нео в поисках Морфиуса оказываются на крыше, один из пилотов вертолета трансформируется в агента Джонса. При этом левый висок Джонса приходится на затылок пилота. Однако после выстрела Тринити именно в этот висок, пулевое отверстие у пилота, покинутого «программой» агента, почему-то оказывается во лбу.", "spoiler": true}, {"kind": "blooper", "text": "В сцене, когда Нео впервые встречается с Морфиусом, герой Лоренса Фишбёрна здоровается с Избранным. Морфиус протягивает правую руку, при этом левая рука у него за спиной. Далее сразу же следует вставка с другого ракурса, где левая рука уже почему-то опущена к полу. В следующем кадре левая рука Морфиуса снова за спиной.", "spoiler": true}, {"kind": "blooper", "text": "Когда агент Смит и Морфиус дерутся, последний бьёт агента головой и ломает ему очки. В следующем кадре камера показывает Морфиуса, и можно заметить, что очки ещё надеты на агенте Смите.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 2-й минуте фильма полицейские вламываются в гостиничный номер, чтобы задержать Тринити, она в это момент сидит в неосвещённой комнате. Когда в следующей сцене ей удаётся обезвредить всех полицейских, отчётливо видно, что на стенах появляются работающие светильники.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 6-й минуте фильма Тринити с разбега прыгает в окно, плафон лампы под потолком висит неподвижно. После смены кадра, когда Тринити целится в сторону разбитого окна, и камера приближается к окну, плафон начинает качаться. Светильник вновь висит неподвижно, когда Тринити собирается встать.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 6-й минуте фильма Тринити забегает в телефонную будку, у неё на лице заметен кровавый порез, хотя в прошлой сцене, после прыжка в окно, пореза не было.", "spoiler": true}, {"kind": "blooper", "text": "Когда на 13-й минуте фильма начальник отчитывает Нео за опоздание, положение рук Томаса меняется при сменах кадра.", "spoiler": true}, {"kind": "blooper", "text": "На 14-й минуте фильма Нео берётся за край конверта, чтобы открыть его. В следующем кадре, когда курьер уходит, Нео делает это ещё раз.", "spoiler": true}],
  faq:[
    {q:"О чём фильм «Матрица» без спойлеров концовки?",a:`Фильм следует за Томасом Андерсоном, который начинает подозревать, что привычная реальность — лишь тщательно сконструированная иллюзия. Встреча с Морфеусом и его командой втягивает героя в конфликт с системой контроля и её агентами, заставляя выбирать между комфортной ложью и рискованной правдой.`},
    {q:"Почему фильм называется «The Matrix»?",a:`«Матрица» — это название симулированной реальности, в которой живёт большинство людей, не подозревая об этом. Слово намекает и на «систему», и на «среду», которая формирует восприятие мира и поведение человека.`},
    {q:"Что означают красная и синяя таблетки?",a:`Это метафора выбора: синяя — остаться в привычной картине мира, красная — узнать правду и принять последствия. В контексте фильма это не «магия», а сюжетный инструмент, который фиксирует момент осознанного решения героя.`},
    {q:"Кто такой Нео и почему он важен?",a:`Нео — хакер Томас Андерсон, которого считают ключевой фигурой в борьбе с Матрицей. Его путь — история о сомнениях, выборе и становлении. Персонажа играет <a href="#">Киану Ривз</a>.`},
    {q:"Что означает фраза «There is no spoon»?",a:`Внутри симуляции объект не «реален» сам по себе — меняется восприятие и понимание правил, по которым устроена Матрица. Контролируя ум и интерпретацию, можно «согнуть» ограничения симуляции.`},
    {q:"Нужно ли смотреть продолжения, чтобы понять первый фильм?",a:`Нет, первый фильм работает как самостоятельная история с завершённой аркой. Продолжения расширяют лор, но базовые идеи и сюжет 1999 года понятны без них.`}

const $=(s,r=document)=>r.querySelector(s);
const cls=v=>v>=7?'high':v<5?'low':'';           // родные модификаторы .high/.low
const money=n=>'$'+n.toLocaleString('ru-RU');
const votes=n=>n>=1e6?(n/1e6).toFixed(1)+' млн':n>=1e3?Math.round(n/1e3)+'K':n;
const dur=s=>{if(!s)return'';const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};

/* ═══ HERO (родные классы content-card / ratings-links / movie-layout) ═══ */
const R=DATA.ratings;
const nf=n=>n.toLocaleString('ru-RU');
// favicon источника с откатом DDG → Google → буква
const favIco=(host,letter)=>`<span class="rating-fav" data-l="${letter}"><img src="https://icons.duckduckgo.com/ip3/${host}.ico" alt="" data-h="${host}" onerror="if(this.dataset.g){this.remove()}else{this.dataset.g=1;this.src='https://www.google.com/s2/favicons?domain='+this.dataset.h+'&sz=64'}"></span>`;
// рейтинги — все источники из API 1.2 (ratings.sources)
const SRC_NAME={kp:'Кинопоиск',imdb:'IMDb',tmdb:'TMDB',kinorium:'Kinorium',letterboxd:'Letterboxd',rt:'Rotten Tomatoes',metacritic:'Metacritic'};
const ratingsHtml=DATA.ratings2.map(s=>{
  const val = s.scale===100 ? s.val+'%' : s.val;
  const norm = s.scale===100 ? s.val/10 : s.val;         // к 10-балльной для окраски
  const url = (s.url && s.url!=='#') ? s.url : null;
  const title = s.votes ? `${nf(s.votes)} оценок · ${SRC_NAME[s.k]}` : SRC_NAME[s.k];
  const inner = `${favIco(s.host,s.l)}<span class="rating-value ${cls(norm)}">${val}</span>`;
  return `<div class="rating-container">${
    url ? `<a class="rating-link" href="${url}" target="_blank" rel="noopener" title="${title}">${inner}</a>`
        : `<span class="rating-link" title="${title}">${inner}</span>`}</div>`;
}).join('');

/* ═══ РОТАТОР ПОСТЕРОВ (живой постер-гифка + все постеры из /images, кросс-фейд 3с) ═══ */
(()=>{
  const rot=$('#posterRot');
  // список кадров: первым — анимированный «живой постер» (aniface mp4), затем статичные
  const frames=[];
  if(DATA.posterGif) frames.push({type:'gif',url:DATA.posterGif});
  (DATA.posters||[]).forEach(u=>frames.push({type:'img',url:u}));
  if(!frames.length) frames.push({type:'img',url:DATA.poster});
  rot.innerHTML=frames.map((f,i)=>
    f.type==='gif'
      ? `<div class="rot-frame gif${i===0?' on':''}"><video src="${f.url}" autoplay muted playsinline></video></div>`
      : `<div class="rot-frame${i===0?' on':''}"><img src="${f.url}" alt="" loading="${i<2?'eager':'lazy'}"></div>`
  ).join('');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els=[...rot.children];
  if(els.length<2 || reduce){ const v=rot.querySelector('video'); if(v)v.loop=true; return; }

  const GIF_LOOPS=4, IMG_MS=3000;
  let i=0, timer=null;
  function schedule(){
    const f=frames[i];
    if(f.type==='gif'){
      const v=els[i].querySelector('video'); let n=0;
      v.loop=false; try{v.currentTime=0}catch(e){} v.play().catch(()=>{});
      v.onended=()=>{ if(++n>=GIF_LOOPS){ v.onended=null; advance(); }
                      else { try{v.currentTime=0}catch(e){} v.play().catch(()=>{}); } };
    } else {
      timer=setTimeout(advance, IMG_MS);
    }
  }
  function advance(){
    clearTimeout(timer);
    els[i].classList.remove('on');
    i=(i+1)%els.length;
    els[i].classList.add('on');
    schedule();
  }
  schedule();
})();

  b.tabIndex=i===0?0:-1;
  b.innerHTML=t.label+(t.n?`<span class="n">${t.n}</span>`:'');

const tabBtns=[...bar.querySelectorAll('.nzt-tab')];
// клавиатура: ←/→/Home/End
bar.addEventListener('keydown',e=>{
  const cur=tabBtns.findIndex(b=>b.classList.contains('on'));
  let ni=null;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') ni=(cur+1)%tabBtns.length;
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') ni=(cur-1+tabBtns.length)%tabBtns.length;
  else if(e.key==='Home') ni=0;
  else if(e.key==='End') ni=tabBtns.length-1;
  if(ni!=null){ e.preventDefault(); select(ni); tabBtns[ni].focus(); }
});
function moveInk(b){ ink.style.width=b.offsetWidth+'px'; ink.style.transform=`translateX(${b.offsetLeft}px)` }
function select(i){
  tabBtns.forEach((b,j)=>{ const on=i===j; b.classList.toggle('on',on);
    b.setAttribute('aria-selected',on?'true':'false'); b.tabIndex=on?0:-1; });
  panels.querySelectorAll('.nzt-panel').forEach((p,j)=>p.classList.toggle('on',i===j));
  moveInk(tabBtns[i]);
  tabBtns[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  // применить умную пагинацию к только что показанной панели (ширина теперь известна)
  requestAnimationFrame(refreshActivePaginate);
}

/* Умная пагинация «Показать ещё»: показывает ЦЕЛЫЕ ряды под текущую ширину.
   Число колонок измеряется по факту, при ресайзе — пересчёт (ряды остаются полными). */
const PAGINATE={};                 // panelSelector -> rows (стартовое число рядов = шаг)
function measureCols(grid, tiles){
  const first=tiles[0]; if(!first) return 1;
  const prev=first.style.display; first.style.display='';   // временно показать для замера
  const cs=getComputedStyle(grid);
  const gap=parseFloat(cs.columnGap||cs.gap)||0;
  const tw=first.getBoundingClientRect().width||1;
  first.style.display=prev;
  const w=grid.clientWidth||first.parentElement.clientWidth||1;
  return Math.max(1, Math.round((w+gap)/(tw+gap)));
}
function applyPaginate(panel, rows){
  panel.querySelectorAll('.nz-sg').forEach(sg=>{
    if(sg.style.display==='none') return;                    // скрытая фильтром группа — пропуск
    const grid=sg.querySelector('.similars-list, .nz-photos, .nz-vids');
    if(!grid) return;
    const tiles=[...grid.children];
    if(!tiles.length) return;
    const cols=measureCols(grid, tiles);
    let shownRows=+sg.dataset.pgRows || rows; sg.dataset.pgRows=shownRows;
    const shown=Math.min(tiles.length, cols*shownRows);
    tiles.forEach((t,i)=>{ t.style.display = i<shown ? '' : 'none'; });
    let btn=sg.querySelector('.nz-more');
    if(shown>=tiles.length){ if(btn) btn.remove(); return; }
    if(!btn){
      btn=document.createElement('button'); btn.className='nz-more'; sg.appendChild(btn);
      btn.onclick=()=>{ sg.dataset.pgRows=(+sg.dataset.pgRows||rows)+rows; applyPaginate(panel, rows); };
    }
    const left=tiles.length-shown;
    btn.textContent=`Показать ещё ${Math.min(cols*rows,left)} · осталось ${left}`;
  });
}
function refreshPaginate(sel){                                // применить к одной панели
  const p=document.querySelector(sel); if(p && PAGINATE[sel]!=null) applyPaginate(p, PAGINATE[sel]);
}
function refreshActivePaginate(){                             // к текущей видимой панели
  Object.keys(PAGINATE).forEach(sel=>{ const p=document.querySelector(sel);
    if(p && p.classList.contains('on')) applyPaginate(p, PAGINATE[sel]); });
}

// Фото — реальный /images, группировка по типу
(()=>{
  const langHtml=l=>l?`<span class="nz-photo-lang">${l.toUpperCase()}</span>`:'';
  const tile=it=>{
    const badge=langHtml(it.lang);
    const dl=` data-lang="${it.lang||''}"`;
    if(it.video) return `<div class="nz-photo"${dl}>${badge}<video src="${it.url}" autoplay muted loop playsinline></video></div>`;
    return `<a class="nz-photo"${dl} href="${it.url}" target="_blank" rel="noopener">${badge}<img loading="lazy" src="${it.url}" alt="" onerror="this.onerror=null;this.closest('.nz-photo').style.display='none'"></a>`;
  };
  // чип-бар по разделам (оглавлениям): «Все» + каждая группа
  const total=DATA.photos.reduce((s,g)=>s+g.items.length,0);
  const chips=`<button class="nz-lchip on" data-t="">Все <em>${total}</em></button>`+
    DATA.photos.map(g=>g.items.length?`<button class="nz-lchip" data-t="${g.type}">${g.label} <em>${g.items.length}</em></button>`:'').join('');

  // порядок внутри группы: ru → en → прочие языки (по алфавиту) → без языка
  const langRank=l=>l==='ru'?0:l==='en'?1:l?2:3;
  const sortItems=arr=>arr.map((it,i)=>[it,i]).sort((a,b)=>{
    const d=langRank(a[0].lang)-langRank(b[0].lang);
    if(d) return d;
    if(langRank(a[0].lang)===2){ const c=(a[0].lang).localeCompare(b[0].lang); if(c) return c; }
    return a[1]-b[1];                 // стабильность: исходный порядок внутри языка
  }).map(x=>x[0]);

  $('#np-photos').innerHTML=
    `<div class="nz-lbar">${chips}</div>`+
    DATA.photos.map(g=>g.items.length?`
      <div class="nz-sg" data-type="${g.type}"><h3 class="nz-sg-h">${g.label} <em>${g.items.length}</em></h3>
        <div class="nz-photos${g.items[0].poster?' posters':''}">${sortItems(g.items).map(tile).join('')}</div>
      </div>`:'').join('');

  // фильтрация по разделу (toggle display, без ре-рендера)
  const panel=$('#np-photos');
  PAGINATE['#np-photos']=3;
  panel.querySelectorAll('.nz-lchip').forEach(btn=>btn.onclick=()=>{
    const t=btn.dataset.t;
    panel.querySelectorAll('.nz-lchip').forEach(b=>b.classList.toggle('on',b===btn));
    panel.querySelectorAll('.nz-sg').forEach(sg=>{
      sg.style.display = (!t || sg.dataset.type===t) ? '' : 'none';
    });
    applyPaginate(panel, 3);
  });
})();
