<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1210">
  <title>NaZeleniy — временно недоступен</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 10% 10%, #1f5139 0, transparent 38%), radial-gradient(circle at 90% 90%, #173829 0, transparent 38%), #0b1210; color: #f5f8f6; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 600px); padding: 42px; text-align: center; border: 1px solid rgba(255,255,255,.13); border-radius: 24px; background: rgba(15, 29, 22, .88); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .mark { width: 58px; height: 58px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 18px; background: #27ae60; color: #07140c; font-size: 30px; font-weight: 800; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; }
    p { margin: 0 auto; max-width: 470px; color: #c8d3cd; font-size: 17px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    .primary { background: #27ae60; color: #07140c; }
    .secondary { border: 1px solid rgba(255,255,255,.18); color: #eef4f0; }
    .note { margin-top: 25px; font-size: 14px; color: #91a299; }
    @media (max-width: 520px) { main { padding: 32px 22px; } .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>Сервис временно недоступен</h1>
    <p>Сейчас возникли проблемы на стороне хостинга. Мы уже занимаемся восстановлением работы NaZeleniy.</p>
    <div class="actions">
      <a class="primary" href="https://yoho.pw/" target="_blank" rel="noopener noreferrer">Перейти на YOHO.PW</a>
      <a class="secondary" href="/">Попробовать снова</a>
    </div>
    <p class="note">Спасибо за понимание.</p>
  </main>
</body>
</html>
